name: Extension checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scholar-hover
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scholar-hover/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:corpus
      - run: npm run package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
